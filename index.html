<div id="tmr"><div id="tl"></div><div id="tt"></div><div id="tr2"></div><div id="tx"></div><div class="tb" id="tb"></div></div><div id="sh"></div><div id="tm"></div><div id="ts"></div>
<script>
//PURE-START
const KG=0.4536;
const LIFTS=[['snatch','Snatch'],['psn','Power Snatch'],['clean','Clean'],['pcl','Power Clean'],['jerk','Jerk'],['cj','Clean & Jerk'],['bsq','Back Squat'],['fsq','Front Squat'],['ohs','Overhead Squat'],['dl','Deadlift'],['bench','Bench Press'],['pp','Push Press'],['press','Shoulder Press']];
function lk(n){n=n.toLowerCase();if(/dumbbell|\bdb\b/.test(n))return null;
if(/clean\s*(&|and)\s*jerk/.test(n))return'cj';if(/overhead squat/.test(n))return'ohs';
if(/power snatch/.test(n))return'psn';if(/snatch/.test(n))return'snatch';
if(/power clean/.test(n))return'pcl';if(/clean/.test(n))return'clean';if(/jerk/.test(n))return'jerk';
if(/back squat/.test(n))return'bsq';if(/front squat/.test(n))return'fsq';if(/deadlift/.test(n))return'dl';
if(/bench/.test(n))return'bench';if(/push press/.test(n))return'pp';if(/press/.test(n))return'press';return null}
function blocks(w){const out=[];let c=null,i=0;
w.sections.forEach(s=>{const push=()=>{if(c){c.i=i++;out.push(c);c=null}};const nb=()=>{push();c={sec:s.name,head:'',items:[],iv:[],notes:[]}};
s.lines.forEach((l,li)=>{
if(l.startsWith('•')){if(!c||c.notes.length)nb();c.items.push(l.replace(/^•\s*/,''));c.iv.push((s.vids||{})[li]||'')}
else if(/^(even|odd) min:/i.test(l)){if(!c)nb();c.items.push('— '+l);c.iv.push('')}
else if(/:\s*$/.test(l)&&!/^(weight|goal|note)/i.test(l)){if(!c||c.items.length||c.notes.length)nb();c.head+=(c.head?' ':'')+l}
else{if(!c)nb();c.notes.push(l)}});push()});return out}
function loads(b){const m=b.notes.join(' ').match(/Weight:\s*(.+?)\s+of\s+(T?)1RMs?\b\s*([A-Za-z ]*)/i);if(!m)return null;
const ps=[...m[1].matchAll(/(\d+(?:\.\d+)?)%/g)].map(x=>+x[1]);if(!ps.length)return null;

function calc(pr,p,t,inc){return pr?Math.round(pr*(t?.9:1)*p/100/inc)*inc:null}
function plates(w,bar){let r=(w-bar)/2;if(r<0)return'bar only';const o=[];for(const p of[25,20,15,10,5,2.5,1,.5])while(r>=p-1e-9){o.push(p);r-=p}return(o.join(' + ')||'bar only')+(r>1e-6?' ≈':'')}
function reps(b){const h=b.head;let m=h.match(/sets?\s+(?:of\s+)?([\d,\s]+)\s*reps/i);if(m)return m[1].split(/[,\s]+/).filter(Boolean).map(Number);
m=h.match(/^([\d-]+)\s*reps/i);if(m)return m[1].split('-').map(Number);
const s=+((h.match(/(\d+)\s*sets?/i)||[])[1]||0),n=+((b.items[0]||'').match(/^(\d+)\s/)||[])[1]||0;return s&&n?Array(s).fill(n):[]}
function sig(b){const wn=(b.notes.join(' ').match(/Weight:[^.]*/i)||[''])[0];return(b.head+b.items.join('|')+(/%/.test(wn)?wn:'')).toLowerCase().replace(/[^a-z0-9%\/|]/g,'')}
const e1=(w,r)=>r==1?w:w*(1+r/30);
const nrm=s=>s.toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim().replace(/s$/,'');
function merge(a,b){const o=JSON.parse(JSON.stringify(a));b=b||{};
for(const d in b.sc||{})if(!o.sc[d]||(b.sc[d].u||0)>(o.sc[d].u||0))o.sc[d]=b.sc[d];
for(const k in b.prs||{})if(!o.prs[k]||(b.prs[k].u||0)>(o.prs[k].u||0))o.prs[k]=b.prs[k];
if((b.su||0)>(o.su||0)){o.bw=b.bw;o.bar=b.bar;o.inc=b.inc;o.su=b.su}return o}
function tguess(t){let m;
if(/tabata/i.test(t))return{mode:'int',ir:8,iw:20,irs:10};
if(m=t.match(/(\d+)\s*min(?:ute)?s?\s*(?:alternating\s*)?EMOM/i))return{mode:'emom',er:+m[1],ei:60};
if(m=t.match(/every\s*(\d+)\s*min(?:ute)?s?\s*(?:for|x)\s*(\d+)\s*(min|rounds?|sets?)/i)){const e=+m[1];return{mode:'emom',ei:e*60,er:m[3][0]=='m'?Math.round(m[2]/e):+m[2]}}

if(/for time|time cap/i.test(t)){m=t.match(/(?:time\s*cap|cap)\D{0,12}(\d+)/i);return{mode:'ft',cap:m?+m[1]:0}}

function phases(c){const P=[];if(c.prep>0)P.push({n:'GET READY',s:c.prep,k:'prep'});
if(c.mode=='amrap')P.push({n:'AMRAP',s:c.am*60,k:'work'});
else if(c.mode=='ft')P.push({n:'FOR TIME',s:(c.cap||60)*60,k:'work',up:1});
else if(c.mode=='sw')P.push({n:'STOPWATCH',s:86400,k:'work',up:1});
else if(c.mode=='emom')for(let i=1;i<=c.er;i++)P.push({n:'EMOM',s:c.ei,k:'work',r:i,of:c.er});
else for(let i=1;i<=c.ir;i++){P.push({n:'WORK',s:c.iw,k:'work',r:i,of:c.ir});if(c.irs>0&&i<c.ir)P.push({n:'REST',s:c.irs,k:'rest',r:i,of:c.ir})}
return P}
const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,'0');return h?`${h}:${p(m)}:${p(x)}`:`${p(m)}:${p(x)}`};
//PURE-END
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const PROFILES=[['pedro','Pedro'],['cesar','César'],['rui','Rui']],defU=()=>({sc:{},prs:{},bw:null,bar:20,inc:1,su:0}),pname=()=>(PROFILES.find(x=>x[0]==PF)||[])[1]||'';
let PF=LS('pf')||null,U=Object.assign(defU(),PF?LS('u_'+PF):{}),W=LS('w')||{workouts:{}},G=LS('gh')||{},V={tab:'w',date:null},T,usha=null,tmr;
const today=()=>new Date().toLocaleDateString('sv'),add=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('sv')};
const rest=d=>[0,4].includes(new Date(d+'T12:00').getDay()),sleep=ms=>new Promise(r=>setTimeout(r,ms));
V.date=today();V.hm=LS('hv')||'l';V.cm=today().slice(0,7);
let TC=Object.assign({mode:'amrap',am:12,cap:0,er:10,ei:60,ir:8,iw:20,irs:10,prep:10,voice:1},LS('tc')||{}),TT='',TB=null,TCtx='set',PRE=null,RN=null,AC=null;
function cv(t){t=t.replace(/(\d+)\/(\d+)#/g,(m,a)=>Math.round(a*KG)+' kg').replace(/(\d+)\/(\d+)(?=\s*(?:m\b|cal|[”"]))/g,'$1');return t.replace(/\bBW\/70%BW\b/g,U.bw?U.bw+' kg':'BW')}
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
function sheet(h){const s=$('#sh');s.innerHTML='<div>'+h+'<button data-a="x">Close</button></div>';s.style.display='flex'}
const closeSheet=()=>{$('#sh').style.display='none';$('#sh').innerHTML=''};
// ---- GitHub
const api=(p,o={})=>fetch(`https://api.github.com/repos/${G.repo}/${p}`,{...o,headers:{Authorization:'Bearer '+G.token,Accept:'application/vnd.github+json',...(o.headers||{})}});
const b64=s=>{let b='';new TextEncoder().encode(s).forEach(c=>b+=String.fromCharCode(c));return btoa(b)};
const dec=c=>new TextDecoder().decode(Uint8Array.from(atob(c.replace(/\n/g,'')),x=>x.charCodeAt(0)));
async function loadW(){if(!G.repo)return render();try{const r=await api('contents/data/workouts.json?t='+Date.now(),{headers:{Accept:'application/vnd.github.raw+json'}});if(r.ok){W=await r.json();SV('w',W)}else if(r.status!=404)throw 0}catch(e){toast('Offline – showing saved data')}render()}
async function loadU(){if(!G.repo||!PF)return;const pf=PF,fn=`user-${pf}.json`;try{const r=await api(`contents/data/${fn}?t=`+Date.now(),{headers:{Accept:'application/vnd.github.raw+json'}});if(pf!==PF)return;if(r.status==404){usha=null;return pushU()}if(!r.ok)return;const rem=await r.json();
const l=await api('contents/data?t='+Date.now());usha=l.ok?((await l.json()).find(x=>x.name==fn)||{}).sha||null:null;if(pf!==PF)return;
const m=merge(U,rem);U=m;SV('u_'+PF,U);if(JSON.stringify(m)!==JSON.stringify(rem))await pushU();render()}catch(e){}}
async function pushU(){if(!G.repo||!PF)return;try{const r=await api(`contents/data/user-${PF}.json`,{method:'PUT',body:JSON.stringify({message:'update',content:b64(JSON.stringify(U)),...(usha?{sha:usha}:{})})});if(r.ok)usha=(await r.json()).content.sha;else if(r.status==409||r.status==422)await loadU()}catch(e){}}
function save(){SV('u_'+PF,U);clearTimeout(tmr);tmr=setTimeout(pushU,3000)}
async function syncNow(since){if(!G.token){V.tab='s';return render()}const before=W.generated_at;toast(since?'Loading older workouts… (1–3 min)':'Syncing…');
const r=await api('actions/workflows/sync.yml/dispatches',{method:'POST',body:JSON.stringify({ref:'main',...(since?{inputs:{backfill:'true',since}}:{})})});
if(!r.ok)return toast('Could not start sync ('+r.status+'). Token needs Actions: read & write.');
for(let i=0;i<(since?60:24);i++){await sleep(5000);await loadW();if(W.generated_at!==before){toast(W.ok?'Updated ✓':'Sync failed: '+W.error);return}}toast('Still running – try again in a minute')}
// ---- views
function banner(){const m=[];if(!G.repo)m.push('Connect GitHub in Settings to load workouts.');else{
if(W.ok===false)m.push('Last sync failed: '+W.error+'. Tap ⟳ Sync.');
const age=W.generated_at?(Date.now()-new Date(W.generated_at))/36e5:null;
if(age===null)m.push('No data yet. Tap ⟳ Sync.');else if(age>30)m.push('Workouts last updated '+Math.round(age)+' h ago.');
const t=today();if(!W.workouts[t]&&!rest(t)&&age!==null)m.push("Today's workout isn't loaded yet – showing the latest available.")}
return m.map(x=>`<div class="warn">${E(x)}</div>`).join('')}
function repIdx(){const R={};Object.keys(W.workouts).sort().forEach(d=>blocks(W.workouts[d]).forEach(b=>{if(/warm|cool/i.test(b.sec)||!b.items.length)return;(R[sig(b)]=R[sig(b)]||[]).push({d,i:b.i})}));return R}
function chips(b,L){if(!L)return'';let h='<div class="chips">';

L.keys.forEach(([nm,k])=>{const pr=U.prs[k]?.v;h+=`<b>${E(nm)} · ${L.t?'% of T1RM (90% of 1RM)':'% of 1RM'}${pr?'':' – <a href="#" data-a="tab" data-t="l" style="color:var(--a)">set PR</a>'}</b>`;
L.ps.forEach(p=>{const w=calc(pr,p,L.t,U.inc||1);h+=`<button data-a="pl" data-w="${w||''}">${w?`<b style="display:inline;color:var(--t)">${w} kg</b> <small>${p}%</small>`:p+'%'}</button>`})});return h+'</div>'}
function bHTML(b,d,R){const sc=!/warm|cool/i.test(b.sec),L=loads(b),S=((U.sc[d]||{}).b||{})[b.i];let h='<div class="blk">';
if(b.head)h+=`<div class="hd">${E(cv(b.head))}</div>`;b.items.forEach((i,x)=>h+=b.iv[x]?`<div class="it" data-a="vid" data-v="${b.iv[x]}" data-n="${E(cv(i))}" style="cursor:pointer"><span style="color:var(--a)">▶</span> ${E(cv(i))}</div>`:`<div class="it">${E(cv(i))}</div>`);h+=chips(b,L);

const rm=(b.head+' '+b.notes.join(' ')).match(/rest\s+(\d+)(?:-(\d+))?\s*min/i);if(rm)h+=`<button data-a="tm" data-s="${(rm[2]||rm[1])*60}">⏱ Rest ${rm[2]||rm[1]} min</button>`;
{const tg=tguess(b.head+' '+b.notes.join(' ')+' '+b.items.join(' '));if(sc&&(tg||/condition/i.test(b.sec)))h+=`<button data-a="bt" data-d="${d}" data-i="${b.i}">⏱ Timer</button>`}
if(sc){const rp=(R[sig(b)]||[]).filter(x=>x.d<d);if(rp.length)h+=`<button class="rb" data-a="rep" data-d="${d}" data-i="${b.i}">🔁 Repeated workout · last ${rp[rp.length-1].d}</button>`;

if(S)h+=`<div class="nt">${E(S.res||'')} ${S.rx===false?'(scaled)':'(Rx)'} ${S.sets?.length?'· '+S.sets.map(x=>x.w+'×'+x.r).join(', '):''}${S.n?'<br>“'+E(S.n)+'”':''}</div>`}
return h+'</div>'}
function vDay(){const d=V.date,w=W.workouts[d];const lbl=new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});

if(d!=today())h+='<button data-a="go" data-d="'+today()+'">Go to today</button>';
if(!w){h+=`<div class="card">${rest(d)?'🛌 Rest day (Thu & Sun)':'No workout stored for this date.'}</div>`;const last=Object.keys(W.workouts).sort().filter(x=>x<d).pop();if(last&&!rest(d))h+=`<button data-a="go" data-d="${last}">Show latest stored (${last})</button>`;$('#app').innerHTML=h;return}

const EM=['','😫','😕','😐','🙂','🔥'],p2=n=>String(n).padStart(2,'0');
function vCal(){const[y,m]=V.cm.split('-').map(Number),first=new Date(y,m-1,1),dim=new Date(y,m,0).getDate(),off=(first.getDay()+6)%7;let nw=0,nl=0;
let h=`<div class="nav2"><button data-a="cm" data-n="-1">‹</button><b>${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</b><button data-a="cm" data-n="1">›</button></div><div class="cal">`+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="wd">${x}</div>`).join('');
for(let i=0;i<off;i++)h+='<div class="cd x"></div>';
for(let d=1;d<=dim;d++){const ds=`${y}-${p2(m)}-${p2(d)}`,w=W.workouts[ds],s=U.sc[ds],n=s?Object.keys(s.b||{}).length:0;if(w)nw++;if(n)nl++;
h+=`<div class="cd ${w?'hw':''} ${n?'lg':''} ${ds==today()?'td':''}" data-a="go" data-d="${ds}"><span>${d}</span><i>${s?.feel?EM[s.feel]:n?'✓':w?'•':''}</i></div>`}
return h+`</div><div class="nt" style="margin-top:8px">${nw} workouts · ${nl} with scores</div>`}
function vHist(){let h=banner()+`<select id="hmode" style="width:auto"><option value="l" ${V.hm=='l'?'selected':''}>Single lines</option><option value="m" ${V.hm=='m'?'selected':''}>Month</option></select>`;
if(V.hm=='m')h+=vCal();else{const ds=[...new Set([...Object.keys(W.workouts),...Object.keys(U.sc)])].sort().reverse();
h+=ds.length?ds.map(d=>{const s=U.sc[d],n=s?Object.keys(s.b||{}).length:0;return`<div class="row" data-a="go" data-d="${d}"><span>${d} ${new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short'})}${W.workouts[d]?.cycle?' · '+E(W.workouts[d].cycle):''}</span><span>${n?n+' logged ':''}${EM[s?.feel||0]}</span></div>`}).join(''):'<div class="card">Nothing yet.</div>'}
$('#app').innerHTML=h}
function lh(){const M={};Object.keys(U.sc).sort().forEach(d=>Object.values(U.sc[d].b||{}).forEach(b=>(b.sets||[]).forEach(x=>{const k=nrm(x.l||'');if(!k||!x.w||!x.r)return;(M[k]=M[k]||{n:x.l,rows:[]}).rows.push({d,w:x.w,r:x.r})})));return M}
function vLifts(){let h='<div class="card"><b>My 1RMs (kg)</b>'+LIFTS.map(([k,n])=>`<div class="row"><span>${n}${U.prs[k]?`<br><small class="nt">set ${U.prs[k].d||new Date(U.prs[k].u).toLocaleDateString('sv')}${U.prs[k].h?.length?' · prev '+U.prs[k].h.slice(-3).reverse().map(x=>x.v+' kg ('+x.d+')').join(', '):''}</small>`:''}</span><input style="width:90px;margin:0" type="number" inputmode="decimal" data-pr="${k}" value="${U.prs[k]?.v||''}"></div>`).join('')+'<div class="nt">Typed PRs are dated today; PRs accepted from a logged set use that workout date. Back squat % are calculated on T1RM (90% of this) when the programme says so.</div></div><div class="sec">Logged lifts</div>';
const M=lh(),ks=Object.keys(M);h+=ks.length?ks.map(k=>`<div class="row" data-a="lift" data-k="${E(k)}"><span>${E(M[k].n)}</span><span>best ${Math.max(...M[k].rows.map(r=>r.w))} kg</span></div>`).join(''):'<div class="nt">Log sets in a workout to see history here.</div>';$('#app').innerHTML=h}
function vSet(){TCtx='set';$('#app').innerHTML=`<div class="card"><b>Profile: ${pname()}</b><div class="nt">PRs, scores and bodyweight are separate for each profile. GitHub connection is shared on this phone.</div><button data-a="pfsw">Switch profile</button></div><div class="card"><b>⏱ Timer</b>${tform()}</div><div class="card"><b>Training</b>Bodyweight (kg)<input id="bw" type="number" inputmode="decimal" value="${U.bw||''}">Bar weight (kg)<input id="bar" type="number" value="${U.bar}">Load increment (kg)<input id="inc" type="number" step="0.5" value="${U.inc}"></div>
<div class="card"><b>GitHub</b><input id="repo" placeholder="user/pj-data" value="${E(G.repo||'')}"><input id="tok" type="password" placeholder="Token" value="${E(G.token||'')}"><button class="pri" data-a="gs">Save & load</button></div><div class="card"><b>Load older workouts</b><div class="nt">⟳ Sync (top) is the fast daily update. Use this once to fetch past weeks.</div>From date<input id="since" type="date" value="2026-08-24"><button data-a="bf">Load older workouts</button></div>
<div class="card"><b>Backup</b><div class="nt">Your scores also live in data/user.json in your private repo.</div><button data-a="dl">Download .json</button><button data-a="cp">Copy to clipboard</button><textarea id="rt" placeholder="Paste a backup here to restore…"></textarea><input id="rf" type="file" accept=".json"><button data-a="rs">Restore</button></div>`}
function vProf(){$('#app').innerHTML='<div class="card" style="text-align:center"><h2>Who is training?</h2>'+PROFILES.map(([k,n])=>`<button class="pfb" data-a="pf" data-p="${k}">${n}</button>`).join('')+'</div>'}
function render(){$('#pb').textContent=PF?'👤 '+pname():'';document.querySelector('nav').style.display=PF?'flex':'none';if(!PF)return vProf();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==V.tab));({w:vDay,h:vHist,l:vLifts,s:vSet})[V.tab]()}
// ---- timer
function tform(){const c=TC,M=[['amrap','AMRAP'],['ft','For time'],['emom','EMOM'],['int','Intervals'],['sw','Stopwatch']];
const f=(k,l,v)=>`<label class="nt">${l}</label><input type="number" inputmode="numeric" data-tf="${k}" value="${v}">`;
let h='<div style="display:flex;flex-wrap:wrap">'+M.map(([m,n])=>`<button data-a="tmode" data-m="${m}" class="${c.mode==m?'pri':''}">${n}</button>`).join('')+'</div>';
if(c.mode=='amrap')h+=f('am','Minutes',c.am);
if(c.mode=='ft')h+=f('cap','Time cap in minutes (0 = 60)',c.cap);
if(c.mode=='emom')h+=f('er','Rounds',c.er)+f('ei','Every (seconds)',c.ei);
if(c.mode=='int')h+=f('ir','Rounds',c.ir)+f('iw','Work (seconds)',c.iw)+f('irs','Rest (seconds)',c.irs)+'<button data-a="tabata">Tabata 8 × 20/10</button>';
h+=`<label class="nt">Get-ready countdown (seconds)</label><select data-tf="prep">${[0,5,10,15,20,30].map(x=>`<option ${c.prep==x?'selected':''}>${x}</option>`).join('')}</select>`;
h+=`<label class="nt">Voice announcements</label><select data-tf="voice"><option value="1" ${c.voice?'selected':''}>On</option><option value="0" ${c.voice?'':'selected'}>Off</option></select><button data-a="ttest">🔊 Test sound</button>`;
return h+'<button class="pri" data-a="tstart" style="width:100%;font-size:18px;padding:14px">▶ Start</button>'}
const readTF=()=>document.querySelectorAll('[data-tf]').forEach(i=>TC[i.dataset.tf]=+i.value);
const reTF=()=>TCtx=='sheet'?sheet(`<h3>⏱ ${E(TT)}</h3>`+tform()):render();
function beep(f,ms,ty){try{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.value=ty?.35:.6;o.start();o.stop(AC.currentTime+ms/1000)}catch(e){}}
const buzz=(f,ms=600)=>beep(f,ms,'square');
function say(t){if(!TC.voice||!window.speechSynthesis)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=1.05;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const wake=()=>{try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>{if(RN)RN.wl=l}).catch(()=>{})}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(RN&&!RN.done&&!document.hidden)wake()});
function ctrl(){const b=$('#tb');b.innerHTML=RN.done?(TB&&RN.res?'<button data-a="tlog">Log this time</button>':TB?'<button data-a="tlog">Log score</button>':'')+'<button data-a="tclose">Close</button>':`<button data-a="tpause">${RN.pa?'Resume':'Pause'}</button>${RN.P[RN.bi]?.up?'<button data-a="tfin">Finish</button>':''}<button data-a="tstop">Stop</button>`}
function paint(bg,l,t,r,x){$('#tmr').style.background=bg;$('#tl').textContent=l;$('#tt').textContent=t;$('#tr2').textContent=r||'';$('#tx').textContent=x||''}
function tick(){if(!RN||RN.pa||RN.done)return;const e=(performance.now()-RN.t0)/1000;let acc=0,i=0;
for(;i<RN.P.length;i++){if(e<acc+RN.P[i].s)break;acc+=RN.P[i].s}
if(i>=RN.P.length)return tfinish(e,RN.P.at(-1).up?'CAP':'');
const p=RN.P[i],el=e-acc,left=p.s-el,L=Math.ceil(left);
if(i!==RN.bi){RN.bi=i;RN.l=99;ctrl();if(p.k!='prep'){buzz(p.k=='rest'?600:1100);navigator.vibrate&&navigator.vibrate(200);say(p.k=='rest'?'Rest':!p.of||p.r==1?'Go':p.r==p.of?'Last round':'Round '+p.r)}}
if(L!=RN.l){RN.l=L;if(L>=1&&L<=3&&(!p.up||RN.cap))beep(800,150)}
{const S=p.s,M=[];if(p.k=='work'&&!p.of&&!p.up){if(S>=120)M.push([S/2,'Halfway there']);if(S>=75&&S/2!=60)M.push([60,'One minute left']);if(S>=45&&S/2!=30)M.push([30,'Thirty seconds']);if(S>20)M.push([10,'Ten seconds'])}
else if(p.up&&RN.cap&&S>=120)M.push([60,'One minute to the cap'],[30,'Thirty seconds to the cap']);
M.forEach(([x,t])=>{const k=i+'_'+x;if(left<=x&&left>x-2&&!RN.said[k]){RN.said[k]=1;say(t)}})}
const total=RN.P.reduce((a,x)=>a+(x.up?0:x.s),0),pre=RN.P[0].k=='prep'?RN.P[0].s:0;
paint(p.k=='prep'?'#b8860b':p.k=='rest'?'#b53a3a':'#1f8a4c',p.n,p.up?fmt(el):fmt(L),p.of?`Round ${p.r} / ${p.of}`:'',p.up?(p.k=='work'&&RN.P.length&&RN.cap?`Cap ${fmt(RN.cap)}`:''):(RN.P.length>1?`Total left ${fmt(total-e)}`:''))}
function tfinish(e,how){clearInterval(RN.iv);RN.done=true;const pre=RN.P[0].k=='prep'?RN.P[0].s:0,up=RN.P.at(-1).up;
RN.res=up&&how!='CAP'?fmt(e-pre):'';buzz(900,1100);say(how=='CAP'?'Time cap':up?'Done':'Time');navigator.vibrate&&navigator.vibrate([300,150,300,150,300]);
paint('#2a3b66',how=='CAP'?'TIME CAP':'DONE',RN.res||(up?fmt(e-pre):''),'', '');ctrl()}
function runT(label){readTF();const c=TC;SV('tc',c);const P=phases(c);if(!P.length||P.some(x=>!(x.s>0)))return toast('Check the numbers');
AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();closeSheet();
if(TC.voice&&window.speechSynthesis){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
RN={P,t0:performance.now(),pa:null,bi:-1,done:false,label,said:{}};const up=P.find(x=>x.up);if(up&&c.mode=='ft')RN.cap=up.s;
$('#tmr').style.display='flex';wake();RN.iv=setInterval(tick,100);tick()}
function closeT(){if(RN){clearInterval(RN.iv);try{RN.wl&&RN.wl.release()}catch(e){}}RN=null;$('#tmr').style.display='none'}
// ---- actions
const dy=d=>U.sc[d]=U.sc[d]||{b:{}},touch=d=>{U.sc[d].u=Date.now();save()};
const srow=r=>`<div class="sr"><input class="l" placeholder="Lift" value="${E(r.l||'')}"><input class="w" type="number" step="0.5" inputmode="decimal" placeholder="kg" value="${r.w??''}"><input class="r" type="number" inputmode="numeric" placeholder="reps" value="${r.r??''}"></div>`;
function prefill(b){const L=loads(b);if(!L||!L.keys.length)return[];const[nm,k]=L.keys[0],rp=reps(b),n=Math.max(L.ps.length,rp.length,1);
return Array.from({length:n},(_,i)=>({l:nm,w:calc(U.prs[k]?.v,L.ps[i]??L.ps[0],L.t,U.inc||1),r:rp[i]??rp[0]??''}))}
function setPR(k,v,d){const o=U.prs[k];if(o&&o.v==v)return;U.prs[k]={v,d:d||today(),u:Date.now(),h:(o?.h||[]).concat(o?[{v:o.v,d:o.d||new Date(o.u).toLocaleDateString('sv')}]:[])};U.su=Date.now();save()}
const ACT={
tab:D=>{V.tab=D.t;render()},
cm:D=>{const[y,m]=V.cm.split('-').map(Number),x=new Date(y,m-1+ +D.n,1);V.cm=x.getFullYear()+'-'+p2(x.getMonth()+1);render()},
pfsw:async()=>{clearTimeout(tmr);await pushU();PF=null;SV('pf',null);usha=null;render()},
pf:D=>{PF=D.p;SV('pf',PF);U=Object.assign(defU(),LS('u_'+PF)||{});usha=null;V.tab='w';V.date=today();render();
const old=LS('u');if(old&&!LS('um')&&!Object.keys(U.sc).length&&!Object.keys(U.prs).length)sheet(`<h3>Import earlier data?</h3><div class="nt">Found scores and PRs saved on this phone from before profiles existed. Import them into ${pname()}?</div><button class="pri" data-a="imp">Import into ${pname()}</button><button data-a="impno">No, start empty</button>`);
loadU().then(loadW)},
imp:()=>{U=Object.assign(defU(),LS('u'));SV('um',1);save();closeSheet();render()},impno:()=>{SV('um',1);closeSheet()},
bt:D=>{const b=blocks(W.workouts[D.d])[+D.i];readTF();Object.assign(TC,tguess(b.head+' '+b.notes.join(' ')+' '+b.items.join(' '))||{});TT=b.head||b.sec;TB={d:D.d,i:D.i};TCtx='sheet';reTF()},
tmode:D=>{readTF();TC.mode=D.m;reTF()},tabata:()=>{readTF();Object.assign(TC,{ir:8,iw:20,irs:10});reTF()},
tstart:()=>{if(TCtx=='set')TB=null;runT()},
tpause:()=>{if(RN.pa){RN.t0+=performance.now()-RN.pa;RN.pa=null}else RN.pa=performance.now();ctrl()},
tfin:()=>tfinish((performance.now()-RN.t0)/1000,''),
tstop:()=>{if(RN.cf)closeT();else{RN.cf=1;toast('Tap Stop again to end');setTimeout(()=>{if(RN)RN.cf=0},3000)}},
ttest:()=>{readTF();AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();beep(800,150);setTimeout(()=>buzz(1100),400);setTimeout(()=>say('Halfway there'),1300)},
tclose:closeT,tlog:()=>{const r=RN.res,b=TB;closeT();PRE=r;ACT.log({d:b.d,i:b.i})},go:D=>{V.tab='w';V.date=D.d;render()},step:D=>{V.date=add(V.date,+D.n);render()},sync:()=>syncNow(),bf:()=>{const d=$('#since').value;if(/^\d{4}-\d{2}-\d{2}$/.test(d))syncNow(d)},x:closeSheet,
tm:D=>{clearInterval(T);let t=+D.s;const f=()=>{$('#tm').innerHTML=`⏱ ${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}<button data-a="tmx">✕</button>`;if(t--<=0){clearInterval(T);$('#tm').innerHTML='';navigator.vibrate&&navigator.vibrate([300,150,300])}};f();T=setInterval(f,1000)},
vid:D=>{const[id,t]=D.v.split(':');sheet(`<h3>${E(D.n)}</h3><div style="position:relative;padding-top:56.25%"><iframe src="https://www.youtube-nocookie.com/embed/${id}?playsinline=1&rel=0&autoplay=1${t?'&start='+t:''}" style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><p><a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener" style="color:var(--a)">Video not playing? Open in YouTube</a></p>`)},
tmx:()=>{clearInterval(T);$('#tm').innerHTML=''},
pl:D=>{if(D.w)toast(D.w+' kg → '+plates(+D.w,U.bar||20)+' per side (bar '+(U.bar||20)+' kg)')},
feel:D=>{const s=dy(V.date);s.feel=s.feel==+D.v?0:+D.v;touch(V.date);render()},
log:D=>{const b=blocks(W.workouts[D.d])[+D.i],s=((U.sc[D.d]||{}).b||{})[b.i]||{},rows=s.sets||prefill(b);
sheet(`<h3>${E(cv(b.head||b.sec))}</h3><input id="res" placeholder="Result (time, rounds + reps, total reps…)" value="${E(s.res||PRE||'')}"><label><input type="checkbox" id="rx" style="width:auto" ${s.rx===false?'':'checked'}> Rx</label><div id="sets">${rows.map(srow).join('')}</div><button data-a="addset">+ Set</button><textarea id="bn" placeholder="How did it feel?">${E(s.n||'')}</textarea><button class="pri" data-a="saveb" data-d="${D.d}" data-i="${D.i}">Save</button>`);PRE=null},
addset:()=>$('#sets').insertAdjacentHTML('beforeend',srow({})),
saveb:D=>{const sets=[...document.querySelectorAll('#sets .sr')].map(r=>({l:r.querySelector('.l').value.trim(),w:+r.querySelector('.w').value,r:+r.querySelector('.r').value})).filter(x=>x.w||x.r);
const s=dy(D.d);s.b[D.i]={res:$('#res').value.trim(),rx:$('#rx').checked,sets,n:$('#bn').value.trim()};touch(D.d);
const best={};sets.forEach(x=>{const k=lk(x.l);if(!k||!x.w||!x.r||x.r>5)return;const e=Math.round(e1(x.w,x.r));if(!best[k]||e>best[k])best[k]=e});
const of=Object.entries(best).filter(([k,e])=>e>(U.prs[k]?.v||0));closeSheet();render();
if(of.length)sheet('<h3>New PR? 🎉</h3>'+of.map(([k,e])=>`<div class="row"><span>${LIFTS.find(x=>x[0]==k)[1]}: ${e} kg (est. 1RM)</span><button class="pri" data-a="pr" data-k="${k}" data-v="${e}" data-d="${D.d}">Update</button></div>`).join(''))},
pr:D=>{setPR(D.k,+D.v,D.d);toast('PR updated');closeSheet();render()},
rep:D=>{const w=W.workouts[D.d],b=blocks(w)[+D.i],s=sig(b),R=repIdx()[s].filter(x=>x.d<D.d).reverse();
sheet('<h3>🔁 Done before</h3>'+R.map(x=>{const sc=U.sc[x.d]||{},bs=(sc.b||{})[x.i];return`<div class="card"><b>${x.d}</b> ${['','😫','😕','😐','🙂','🔥'][sc.feel||0]}<br>${bs?E(bs.res||'')+' '+(bs.rx===false?'(scaled)':'(Rx)')+(bs.sets?.length?'<br>'+bs.sets.map(z=>z.w+'×'+z.r).join(', '):'')+(bs.n?'<br>“'+E(bs.n)+'”':''):'<span class="nt">No score logged</span>'}${sc.note?'<div class="nt">Day: '+E(sc.note)+'</div>':''}</div>`}).join(''))},
lift:D=>{const M=lh()[D.k],by={};M.rows.forEach(r=>by[r.d]=Math.max(by[r.d]||0,e1(r.w,r.r)));const ds=Object.keys(by),v=ds.map(d=>by[d]),mn=Math.min(...v),mx=Math.max(...v);
const pts=ds.map((d,i)=>`${ds.length>1?i*300/(ds.length-1):150},${70-(mx==mn?35:(by[d]-mn)/(mx-mn)*60)}`).join(' ');
sheet(`<h3>${E(M.n)}</h3><div class="nt">Best estimated 1RM per session</div><svg viewBox="0 0 300 80" style="width:100%;background:#0e1115;border-radius:8px"><polyline fill="none" stroke="#ff7a1a" stroke-width="2" points="${pts}"/></svg>`+M.rows.slice().reverse().slice(0,40).map(r=>`<div class="row"><span>${r.d}</span><span>${r.w} kg × ${r.r} · e1RM ${Math.round(e1(r.w,r.r))}</span></div>`).join(''))},
gs:()=>{G={repo:$('#repo').value.trim(),token:$('#tok').value.trim()};SV('gh',G);toast('Loading…');loadU().then(loadW)},
dl:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(U)],{type:'application/json'}));a.download='pj-backup-'+today()+'.json';a.click()},
cp:()=>navigator.clipboard.writeText(JSON.stringify(U)).then(()=>toast('Copied'),()=>toast('Copy failed')),
rs:()=>{try{const o=JSON.parse($('#rt').value);U=Object.assign({sc:{},prs:{},bw:null,bar:20,inc:1,su:0},o);save();toast('Restored');render()}catch(e){toast('Invalid backup text')}}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;e.preventDefault();const f=ACT[t.dataset.a];f&&f(t.dataset)});
document.addEventListener('change',e=>{const t=e.target;
if(t.id=='dn'){dy(V.date).note=t.value;touch(V.date)}
else if(t.id=='hmode'){V.hm=t.value;SV('hv',V.hm);render()}
else if(t.dataset.tf)TC[t.dataset.tf]=+t.value
else if(t.dataset.pr){const v=+t.value;if(v>0)setPR(t.dataset.pr,v)}
else if(['bw','bar','inc'].includes(t.id)){U[t.id]=+t.value||null;if(t.id!='bw'&&!U[t.id])U[t.id]=t.id=='bar'?20:1;U.su=Date.now();save()}
else if(t.id=='rf'&&t.files[0])t.files[0].text().then(x=>{$('#rt').value=x})});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
render();loadU().then(loadW);
</script></body></html>
